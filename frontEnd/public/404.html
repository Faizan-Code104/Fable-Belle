<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="robots" content="noindex, follow" />

  <title>Page Not Found | Ectoo</title>

  <link rel="icon" type="image/png" href="/Ectoo-icon.png" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f8fafc;
      color: #020617;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .content {
      width: 100%;
      max-width: 600px;
      text-align: center;
    }

    .brand {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      color: #94a3b8;
    }

    h1 {
      margin-top: 14px;
      font-size: clamp(72px, 14vw, 120px);
      line-height: 1;
      font-weight: 800;
      letter-spacing: -0.05em;
    }

    h2 {
      margin-top: 22px;
      font-size: 24px;
      font-weight: 700;
    }

    p {
      margin: 12px auto 0;
      max-width: 460px;
      color: #64748b;
      font-size: 15px;
      line-height: 1.7;
    }

    .button {
      display: inline-block;
      margin-top: 30px;
      padding: 14px 28px;
      border-radius: 999px;
      background: #020617;
      color: #ffffff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      transition: opacity 0.2s ease;
    }

    .button:hover {
      opacity: 0.85;
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="content">
      <div class="brand">Ectoo</div>

      <h1>404</h1>

      <h2>Page Not Found</h2>

      <p>
        The page you're looking for doesn't exist or may have been moved.
        Please return to the Ectoo homepage.
      </p>

      <a class="button" href="/">
        Back to Home
      </a>
    </div>
  </main>
</body>
</html>
